services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-market-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_market}
      POSTGRES_USER: ${POSTGRES_USER:-stock_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_market}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_market} -d ${POSTGRES_DB:-stock_market}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stock-market-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: stock-market-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-stock_market}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-stock_market}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: stock-market-auth
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-stock_market}
      POSTGRES_USER: ${POSTGRES_USER:-stock_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_market}
      AUTH_SERVICE_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  market-service:
    build:
      context: .
      dockerfile: services/market-service/Dockerfile
    container_name: stock-market-market
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-stock_market}
      POSTGRES_USER: ${POSTGRES_USER:-stock_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_market}
      MARKET_SERVICE_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    container_name: stock-market-portfolio
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-stock_market}
      POSTGRES_USER: ${POSTGRES_USER:-stock_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_market}
      PORTFOLIO_SERVICE_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
