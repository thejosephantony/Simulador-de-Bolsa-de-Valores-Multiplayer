services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-market-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_market}
      POSTGRES_USER: ${POSTGRES_USER:-stock_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_market}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_market} -d ${POSTGRES_DB:-stock_market}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stock-market-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: stock-market-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-stock_market}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-stock_market}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
