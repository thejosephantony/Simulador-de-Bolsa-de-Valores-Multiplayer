services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-market-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_market}
      POSTGRES_USER: ${POSTGRES_USER:-stock_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_market}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_market} -d ${POSTGRES_DB:-stock_market}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stock-market-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: stock-market-rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    container_name: stock-market-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-stock_market}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-stock_market}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Executa uma vez e termina: configura a DLQ da fila do Realtime (infra/rabbitmq/setup.sh).
  rabbitmq-setup:
    image: curlimages/curl:8.11.1
    container_name: stock-market-rabbitmq-setup
    entrypoint: ["sh", "/setup/setup.sh"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-stock_market}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-stock_market}
    volumes:
      - ./infra/rabbitmq/setup.sh:/setup/setup.sh:ro
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    container_name: stock-market-auth
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-stock_market}
      POSTGRES_USER: ${POSTGRES_USER:-stock_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_market}
      AUTH_SERVICE_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-change-this-demo-secret-key-with-at-least-32-bytes}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8081; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '^HTTP/1.1 200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  market-service:
    build:
      context: .
      dockerfile: backend/market-service/Dockerfile
    container_name: stock-market-market
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-stock_market}
      POSTGRES_USER: ${POSTGRES_USER:-stock_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_market}
      MARKET_SERVICE_PORT: 8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-stock_market}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-stock_market}
      MARKET_OUTBOX_ENABLED: ${MARKET_OUTBOX_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-change-this-demo-secret-key-with-at-least-32-bytes}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      INITIAL_BALANCE: ${INITIAL_BALANCE:-100000.00}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      portfolio-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8082; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '^HTTP/1.1 200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  portfolio-service:
    build:
      context: .
      dockerfile: backend/portfolio-service/Dockerfile
    container_name: stock-market-portfolio
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-stock_market}
      POSTGRES_USER: ${POSTGRES_USER:-stock_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_market}
      PORTFOLIO_SERVICE_PORT: 8083
      JWT_SECRET: ${JWT_SECRET:-change-this-demo-secret-key-with-at-least-32-bytes}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      INITIAL_BALANCE: ${INITIAL_BALANCE:-100000.00}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8083; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '^HTTP/1.1 200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  # Investidores automatizados: negociam pela mesma API REST dos humanos (docs/agents.md).
  agent-service:
    build:
      context: .
      dockerfile: backend/agent-service/Dockerfile
    container_name: stock-market-agents
    environment:
      AGENT_SERVICE_PORT: 8084
      AUTH_URL: http://auth-service:8081
      MARKET_URL: http://market-service:8082
      PORTFOLIO_URL: http://portfolio-service:8083
      AGENT_ADMIN_TOKEN: ${AGENT_ADMIN_TOKEN:-change-this-agent-admin-token}
      AGENTS_START_PAUSED: ${AGENTS_START_PAUSED:-false}
    ports:
      - "8084:8084"
    depends_on:
      auth-service:
        condition: service_healthy
      market-service:
        condition: service_healthy
      portfolio-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8084; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '^HTTP/1.1 200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: stock-market-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.4.0
    container_name: stock-market-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/simulador-overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-market-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8081
    depends_on:
      - auth-service
      - market-service
      - portfolio-service

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
