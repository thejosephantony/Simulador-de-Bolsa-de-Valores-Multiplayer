# Coleta das métricas Actuator/Micrometer dos serviços e do plugin Prometheus do RabbitMQ.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auth-service:8081
          - market-service:8082
          - portfolio-service:8083
          - agent-service:8084

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbitmq:15692
