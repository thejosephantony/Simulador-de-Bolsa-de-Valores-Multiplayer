server:
  port: ${PORTFOLIO_SERVICE_PORT:8083}

spring:
  application:
    name: portfolio-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:stock_market}
    username: ${POSTGRES_USER:stock_market}
    password: ${POSTGRES_PASSWORD:stock_market}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: portfolio
  flyway:
    enabled: true
    schemas: portfolio
    create-schemas: true

portfolio:
  initial-balance: ${INITIAL_BALANCE:100000.00}

security:
  jwt:
    secret: ${JWT_SECRET:change-this-demo-secret-key-with-at-least-32-bytes}
    issuer: stock-market-auth
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
