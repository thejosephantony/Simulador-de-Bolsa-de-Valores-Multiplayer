server:
  port: ${MARKET_SERVICE_PORT:8082}

spring:
  application:
    name: market-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:stock_market}
    username: ${POSTGRES_USER:stock_market}
    password: ${POSTGRES_PASSWORD:stock_market}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: market
  flyway:
    enabled: true
    schemas: market
    create-schemas: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:stock_market}
    password: ${RABBITMQ_DEFAULT_PASS:stock_market}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

market:
  outbox:
    enabled: ${MARKET_OUTBOX_ENABLED:true}
    delay-ms: ${MARKET_OUTBOX_DELAY_MS:500}

security:
  jwt:
    secret: ${JWT_SECRET:change-this-demo-secret-key-with-at-least-32-bytes}
    issuer: stock-market-auth
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: market-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
