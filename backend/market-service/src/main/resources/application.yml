server:
  port: ${MARKET_SERVICE_PORT:8082}

spring:
  application:
    name: market-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:stock_market}
    username: ${POSTGRES_USER:stock_market}
    password: ${POSTGRES_PASSWORD:stock_market}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: market
  flyway:
    enabled: true
    schemas: market
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
