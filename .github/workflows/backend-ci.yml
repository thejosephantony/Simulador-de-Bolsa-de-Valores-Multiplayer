name: Backend CI

on:
  push:
    paths:
      - "services/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend
        run: mvn -B -ntp -f services/pom.xml clean verify
