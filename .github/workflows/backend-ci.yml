name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/part1-smoke-test.sh"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/part1-smoke-test.sh"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend
        run: mvn -B -ntp -f backend/pom.xml clean verify

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start Part 1 backend
        run: docker compose up -d --build postgres auth-service market-service portfolio-service

      - name: Run Part 1 smoke test
        run: bash scripts/part1-smoke-test.sh

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color auth-service market-service portfolio-service postgres

      - name: Stop containers
        if: always()
        run: docker compose down -v
