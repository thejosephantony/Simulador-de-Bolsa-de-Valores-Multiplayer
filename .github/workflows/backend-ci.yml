name: Backend CI

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/part1-smoke-test.sh"
      - "scripts/outbox-smoke-test.sh"
      - "scripts/market-concurrency-test.py"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/part1-smoke-test.sh"
      - "scripts/outbox-smoke-test.sh"
      - "scripts/market-concurrency-test.py"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build backend
        run: mvn -B -ntp -f backend/pom.xml clean verify
      - name: Validate Docker Compose
        run: docker compose config
      - name: Start backend and broker
        run: docker compose up -d --build postgres rabbitmq auth-service market-service portfolio-service
      - name: Run trading smoke test
        run: bash scripts/part1-smoke-test.sh
      - name: Run market concurrency and rollback tests
        env:
          MARKET_ISOLATED_TEST_DB: "1"
        run: python3 scripts/market-concurrency-test.py
      - name: Run outbox smoke test
        run: bash scripts/outbox-smoke-test.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color auth-service market-service portfolio-service postgres rabbitmq
      - name: Stop containers
        if: always()
        run: docker compose down -v
